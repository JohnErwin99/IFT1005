id: 4 
nom: Harira
description: Soupe marocaine traditionnelle à base de tomates, lentilles et pois chiches.
portions: 4
durée_cuisson: 1h
nutrition:
  calories: 250 kcal
  proteines: 15g
  glucides: 35g
  lipides: 7g
image: https://images.immediate.co.uk/production/volatile/sites/30/2021/09/Harira-0ad84c9.jpg?resize=768,574
catégories: 
  - traditionelle
régime:
  - végétarien
parties:
  - partie: Soupe
    ingrédients:
      - 250g de viande de bœuf ou d'agneau coupée en petits morceaux
      - 1 oignon haché
      - 2 tomates râpées
      - 50g de pois chiches trempés la veille
      - 50g de lentilles
      - 2 branches de céleri hachées
      - 1 bouquet de coriandre haché
      - 1 bouquet de persil haché
      - 2 cuillères à soupe de concentré de tomate
      - 1 litre d'eau
      - 50g de farine diluée dans de l'eau
      - 1 cuillère à café de curcuma
      - 1 cuillère à café de gingembre
      - 1 cuillère à café de poivre
      - Sel selon goût
      - 2 cuillères à soupe d'huile d'olive
    étapes:
      - Faire revenir la viande avec l'huile d'olive et l'oignon dans une marmite.
      - Ajouter les tomates, le céleri, la coriandre, le persil, les épices et bien mélanger.
      - Ajouter l'eau et porter à ébullition.
      - Ajouter les pois chiches et laisser mijoter 30 minutes.
      - Ajouter les lentilles et continuer la cuisson 15 minutes.
      - Ajouter le concentré de tomate dilué dans un peu d'eau et bien mélanger.
      - Incorporer la farine diluée tout en remuant pour épaissir la soupe.
      - Laisser cuire encore 10 minutes, puis servir chaud avec du citron.
