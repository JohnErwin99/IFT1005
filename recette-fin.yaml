id: 2
nom: Cake yogourt-pistache
description: Un cake moelleux et parfume
auteur: Tastet
image: https://images.tastet.ca/_/rs:fit:750:500:false:0/plain/local:///2022/11/dscf1867-scaled.jpg@jpg
source:
  url: http://www.tastet.ca/2013/06/06/cake-yogourt-pistache/
  nom: Tastet
  date: 2013-06-06
informations:
  portions: 8
  préparation: 15 minutes
  cuisson: 45 minutes
  refroidissement: 30 minutes
  tempsTotal: 90 minutes
nutrition:
  calories: 300
  lipides: 15
  glucides: 30
  protéines: 15
régime:
  - végétarien
parties:
  - partie: Le crumble aux pistaches
    ingrédients:
      - 20g de beurre vegetal Maison Le Grand non Salé
      - 20g de sucre de pistache en poudre
      - 20g de farine tout usage
      - 25g de casonade
      - 2g de sel
    étapes:
      - Sauter la prochaine partie
  - partie: Le cake yogourt-pistache
    ingrédients:
      - 200g de yogourt vegane nature
      - 160g de cassonade
      - 15g de lait végétal
      - 15g de vinaigre de cidre
      - 120g d'huile d'arachide
      - 200g de farine tout usage
      - 50g d epistcahe en poudre
      - 6g de poure a pate
      - 4g de sel
    étapes:
      - Mélanger le yogourt et la cassonade.
      - Ajouter le lait végétal, le vinaigre de cidre et l’huile. Mélanger à nouveau.
      - Ajouter la farine, les pistaches en poudre, la poudre à pâte et le sel. Mélanger légèrement.
      - Verser le mélange dans un moule graissé (moule à cake, moule à financier ou moule en forme de beigne).
      - Ajouter le crumble pistache directement sur le mélange à cake.
      - Enfourner à 350°F 15 minutes environ. Pour s’assurer d’une cuisson parfaite, le mieux est d’insérer un cure-dent dans le cake, s’il en ressort sec, le cake est cuit.
      - Démouler les cakes, seulement une fois refroidi.
