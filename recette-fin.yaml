      - Ajouter les oignons, l'ail et faire revenir jusqu'à ce qu'ils soient translucides.
      - Ajouter le poulet, les épices, le sel et bien mélanger.
      - Ajouter l'eau, couvrir et laisser mijoter 40 minutes à feu doux.
      - Ajouter les citrons confits, les olives, la coriandre et le persil.
      - Laisser cuire encore 10 minutes.
      - Servir chaud avec du pain marocain.
