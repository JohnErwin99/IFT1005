id: 3
nom: Tortillas de base
description: Deux ingrédients seulement pour cette pâte parfaite pour déjouer les intolérances au gluten de la farine de maïs et de l’eau!
auteur: Radio Canada
image: https://images.radio-canada.ca/v1/ici-tele/16x9/5-chefs-dans-ma-cuisine-tortillas-de-base-19-novembre-2020.jpg
source:
  url: https://ici.radio-canada.ca/recettes/1071/tortillas-de-base
  nom: Radio Canada
  date: 2013-06-06
informations:
  portions: 8
  préparation: 10 minutes
  cuisson: 10 minutes
  refroidissement: 30 minutes
  tempsTotal: 50 minutes
  rendement: 8 tortillas
nutrition:
  calories: 200
  lipides: 10
  glucides: 20
  protéines: 10
régime:
  - sans-gluten
parties:
  - partie: Tortillas de maïs
    ingrédients:
      - 500 ml de farine de maïs
      - 375 ml d'eau
    étapes:
      - Dans un grand bol, mélangez la farine de maïs et l’eau.
      - Pétrissez la pâte quelques minutes afin qu’elle ne colle plus aux mains. Façonnez de petites boules de pâte de la grosseur d’une balle de golf. Réservez.
      - Faites chauffer une poêle antiadhésive ou en fonte à feu moyen de 2 à 3 minutes.
      - Placez une petite boule de pâte entre 2 feuilles de pellicule plastique. Déposez la pâte au centre de la presse à tortillas (voir NOTE). Pressez afin de former un disque d’environ 12 cm (5 po) de diamètre.
      - Déposez une tortilla à la fois dans la poêle bien chaude et faites cuire 20 secondes d’un côté. Retournez et faites cuire 20 secondes supplémentaires. Retournez encore et faites cuire quelques secondes de plus pour terminer la cuisson.
      - Répétez l’opération avec les autres tortillas. Une fois cuites, réservez-les au chaud dans un linge propre et déposez-les dans un contenant hermétique.
