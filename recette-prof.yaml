id: 4 
nom: Harira
description: Soupe marocaine traditionnelle à base de tomates, lentilles et pois chiches.
portions: 4
durée_cuisson: 1h
nutrition:
  calories: 250 kcal
  proteines: 15g
  glucides: 35g
  lipides: 7g
image: https://images.immediate.co.uk/production/volatile/sites/30/2021/09/Harira-0ad84c9.jpg?resize=768,574
catégories: 
  - traditionelle
régime:
  - végétarien
parties:
  - partie: Soupe
    titre: Préparation de la Harira
    ingrédients:
      - 250g de viande de bœuf ou d'agneau
      - 1 oignon haché
      - 2 tomates râpées
      - 50g de pois chiches trempés
      - 50g de lentilles
      - 2 branches de céleri
      - 1 bouquet de coriandre
      - 1 bouquet de persil
      - 2 cuillères à soupe de concentré de tomate
      - 1 litre d'eau
      - 50g de farine diluée
      - Épices (curcuma, gingembre, poivre)
      - 2 cuillères à soupe d'huile d'olive
    étapes:
      - Faire revenir la viande avec l'huile et l'oignon.
      - Ajouter les tomates, céleri, herbes et épices.
      - Ajouter l'eau et porter à ébullition.
      - Ajouter les pois chiches et cuire 30 minutes.
      - Ajouter les lentilles et cuire 15 minutes.
      - Incorporer le concentré de tomate.
      - Ajouter la farine diluée pour épaissir.
      - Laisser cuire encore 10 minutes.
