  - partie: Tajine
    titre: Préparation du tajine
    ingrédients:
      - 1 poulet coupé en morceaux
      - 2 citrons confits coupés
      - 100g d'olives vertes
      - 2 oignons émincés
      - 3 gousses d'ail hachées
      - Épices (curcuma, gingembre, poivre)
      - 1 bouquet de coriandre
      - 1 bouquet de persil
      - 3 cuillères à soupe d'huile d'olive
      - 250ml d'eau
    étapes:
      - Faire chauffer l'huile dans un tajine.
      - Ajouter les oignons, l'ail et faire revenir.
      - Ajouter le poulet et les épices.
      - Ajouter l'eau, couvrir et mijoter 40 minutes.
      - Ajouter les citrons confits et olives.
      - Cuire encore 10 minutes.
